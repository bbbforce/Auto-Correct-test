<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agent协同仿真工作台</title>
    <meta name="description" content="MCP-SIM 多智能体 FEniCS 仿真系统 Web 界面">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <!-- 使用国内可用的静止云 CDN -->
    <link rel="stylesheet" href="https://cdn.staticfile.net/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdn.staticfile.net/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdn.staticfile.net/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.staticfile.net/highlight.js/11.9.0/languages/python.min.js"></script>

    <!-- MathJax 渲染公式配置 -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            startup: {
                typeset: false
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.staticfile.net/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
</head>

<body>
    <div class="layout-wrapper">
        <!-- 左侧历史记录栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="new-chat-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <span>新仿真任务</span>
                </button>
            </div>
            <div class="history-list" id="history-list">
                <!-- 历史项动态加载在这里 -->
            </div>
        </aside>

        <!-- 主体聊天容器 -->
        <div class="app-container">
            <!-- 头部 -->
            <header class="chat-header">
                <button id="mobile-sidebar-toggle" class="icon-btn mobile-only">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M4 6h16M4 12h16M4 18h16" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
                <div class="header-title">agent协同仿真工作台</div>
                <div class="header-settings">
                    <select id="retries-select" title="最大重试次数">
                        <option value="1">重试 1 次</option>
                        <option value="2">重试 2 次</option>
                        <option value="3" selected>重试 3 次</option>
                        <option value="5">重试 5 次</option>
                    </select>
                </div>
            </header>

            <!-- 聊天流 -->
            <main class="chat-main" id="chat-output">
                <div id="welcome-msg" class="welcome-box">
                    <div class="sim-logo-large">⚙️💻</div>
                    <h2>有什么我可以帮忙的？</h2>
                    <div class="quick-chips">
                        <span>上传结构设计图进行应力仿真</span>
                        <span>解析网格参数进行热传导分析</span>
                    </div>
                </div>
            </main>

            <!-- 底部输入区 -->
            <footer class="chat-footer">
                <div class="input-container">
                    <div id="file-chips" class="file-chips-container"></div>
                    <div class="input-wrapper" id="drop-zone">
                        <button class="icon-btn attach-btn" id="attach-btn" title="上传文件">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12 21C8.68629 21 6 18.3137 6 15V7C6 4.79086 7.79086 3 10 3C12.2091 3 14 4.79086 14 7V14.5C14 15.6046 13.1046 16.5 12 16.5C10.8954 16.5 10 15.6046 10 14.5V8H11.5V14.5C11.5 14.7761 11.7239 15 12 15C12.2761 15 12.5 14.7761 12.5 14.5V7C12.5 5.61929 11.3807 4.5 10 4.5C8.61929 4.5 7.5 5.61929 7.5 7V15C7.5 17.4853 9.51472 19.5 12 19.5C14.4853 19.5 16.5 17.4853 16.5 15V8H18V15C18 18.3137 15.3137 21 12 21Z"
                                    fill="currentColor" />
                            </svg>
                        </button>
                        <input type="file" id="file-input" multiple hidden
                            accept=".png,.jpg,.jpeg,.bmp,.gif,.webp,.pdf,.docx,.xlsx,.xls,.pptx,.txt,.md,.csv,.json">
                        <textarea id="prompt-input" placeholder="给 agent 发送仿真任务..." rows="1"></textarea>
                        <button class="icon-btn primary-btn" id="action-btn" title="发送">
                            <!-- 发送图标 -->
                            <svg class="icon-send" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 4L12 20M12 4L6 10M12 4L18 10" stroke="#fff" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <!-- 停止图标隐藏 -->
                            <svg class="icon-stop" width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg" style="display:none">
                                <rect x="7" y="7" width="10" height="10" fill="#fff" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="footer-note">代码生成及控制信息仅供参考。如果未得到理想结果，请考虑重新生成或修改配置。</div>
            </footer>
        </div>
    </div>
    <script src="/static/app.js?v=2"></script>
</body>

</html>
